<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<title>Rice Register</title>
<style>
:root{
  --bg:#f5f7fb; --surface:#fff; --text:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --accent:#2563eb; --accent-2:#1d4ed8;
  --ok:#15803d; --danger:#b91c1c; --shadow:0 8px 30px rgba(15,23,42,.07);
  --radius:20px;
}
html[data-theme="dark"]{--bg:#0b0f14;--surface:#111827;--text:#f8fafc;--muted:#94a3b8;--line:#263241;--accent:#f8fafc;--accent-2:#e2e8f0;--ok:#4ade80;--danger:#f87171;--shadow:0 8px 30px rgba(0,0,0,.28)}
html[data-theme="dark"] .topbar{background:rgba(11,15,20,.92);border-bottom-color:#263241}
html[data-theme="dark"] .hero{background:linear-gradient(135deg,#020617,#111827)}
html[data-theme="dark"] .toggle{background:#1e293b}
html[data-theme="dark"] .toggle button{color:#cbd5e1}
html[data-theme="dark"] .toggle button.active{background:#f8fafc;color:#0f172a}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea,html[data-theme="dark"] .quick,html[data-theme="dark"] .secondary,html[data-theme="dark"] .icon-btn,html[data-theme="dark"] .segment button{background:#0f172a;color:#f8fafc;border-color:#334155}
html[data-theme="dark"] .calc,html[data-theme="dark"] .ev{background:#0b1220;border-color:#263241}
html[data-theme="dark"] .nav{background:rgba(17,24,39,.96);border-color:#263241}
html[data-theme="dark"] .nav button{color:#94a3b8}
html[data-theme="dark"] .nav button.active{background:#f8fafc;color:#0f172a}
html[data-theme="dark"] .badge{background:#1e293b;color:#e2e8f0}
html[data-theme="dark"] .notice{background:#172033;color:#dbeafe;border-color:#334155}
html[data-theme="bw"]{--bg:#f4f4f4;--surface:#fff;--text:#111;--muted:#555;--line:#cfcfcf;--accent:#111;--accent-2:#000;--ok:#111;--danger:#111;--shadow:0 8px 24px rgba(0,0,0,.08)}
html[data-theme="bw"] .hero{background:#111;color:#fff}
html[data-theme="bw"] .badge,html[data-theme="bw"] .notice{background:#eee;color:#111;border-color:#bbb}
html[data-theme="bw"] .primary{background:#111;color:#fff}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:88px}
.topbar{position:sticky;top:0;z-index:10;padding:14px 16px;background:rgba(245,247,251,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(226,232,240,.8)}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:#0f172a;color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-.04em}
.brand-title{font-size:16px;font-weight:800}
.brand-sub{font-size:12px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:14px;display:grid;place-items:center}
.main{padding:18px 16px 0}
.hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:24px;letter-spacing:-.03em}
.hero p{margin:8px 0 0;color:#cbd5e1;font-size:13px}
.toggle{display:flex;background:#e2e8f0;border-radius:14px;padding:4px;gap:4px;margin-top:16px}
.toggle button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 8px;font-weight:800;color:#475569}
.toggle button.active{background:#fff;color:#0f172a;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.section{margin-top:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-size:15px;font-weight:800}
.section-link{font-size:12px;color:var(--accent);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.scheme-card{padding:14px}
.scheme-top{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8}
.scheme-card h3{margin:10px 0 3px;font-size:14px}
.big-num{font-size:24px;font-weight:900;letter-spacing:-.04em}
.mini{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:10px}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick{padding:15px;border:1px solid var(--line);background:#fff;border-radius:18px;text-align:left}
.quick strong{display:block;font-size:14px}
.quick span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.form-card{padding:16px}
label{display:block;font-size:12px;font-weight:800;margin:0 0 7px;color:#334155}
.field{margin-bottom:14px}
input,select,textarea{width:100%;border:1px solid #dbe2ea;background:#fff;color:var(--text);border-radius:14px;padding:13px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.segment{display:flex;gap:7px;overflow:auto;padding-bottom:2px}
.segment button{flex:1;min-width:88px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:800;color:#475569}
.segment button.active{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.calc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:4px 0 14px}
.calc{padding:12px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0}
.calc span{display:block;font-size:11px;color:var(--muted)}
.calc strong{display:block;margin-top:5px;font-size:20px}
.primary{width:100%;border:0;border-radius:16px;padding:14px 16px;background:var(--accent);color:#fff;font-weight:900}
.secondary{border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:#fff;font-weight:800}
.helper{font-size:11px;color:var(--muted);line-height:1.5}
.notice{padding:12px 14px;border-radius:14px;background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe;font-size:12px;line-height:1.5}
.entry-card{padding:15px;margin-bottom:10px}
.entry-row{display:flex;justify-content:space-between;gap:10px}
.entry-title{font-weight:900;font-size:14px}
.entry-meta{font-size:11px;color:var(--muted);margin-top:4px}
.entry-values{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.ev{padding:9px;border-radius:12px;background:#f8fafc}
.ev span{display:block;font-size:10px;color:var(--muted)}
.ev strong{display:block;margin-top:3px;font-size:14px}
.status{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;white-space:nowrap}
.status.pending{background:#fff7ed;color:#9a3412}
.status.synced{background:#f0fdf4;color:#166534}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;width:min(728px,calc(100% - 20px));background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 12px 30px rgba(15,23,42,.12);border-radius:20px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;padding:8px 5px;border-radius:14px;color:#64748b;font-size:11px;font-weight:800}
.nav button.active{background:#eff6ff;color:#1d4ed8}
.nav .ic{font-size:19px;display:block;margin-bottom:2px}

.settings-sheet{position:fixed;inset:0;background:rgba(15,23,42,.36);backdrop-filter:blur(5px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.settings-panel{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -16px 45px rgba(15,23,42,.18)}
.settings-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.settings-head h2{margin:0;font-size:20px}
.close-btn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:13px}
.setting-section{padding:14px 0;border-top:1px solid var(--line)}
.setting-section:first-of-type{border-top:0}
.setting-title{font-size:13px;font-weight:900;margin-bottom:10px}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-btn{border:1px solid var(--line);background:var(--surface);padding:12px;border-radius:14px;text-align:left;font-weight:800}
.theme-btn.active{outline:2px solid var(--accent);border-color:transparent}
.theme-preview{height:40px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line)}
.theme-light{background:#f5f7fb}.theme-dark{background:#0f172a}.theme-bw{background:linear-gradient(90deg,#fff 0 50%,#111 50%)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.theme-grid{grid-template-columns:1fr 1fr}.settings-grid{grid-template-columns:1fr}.settings-actions{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;z-index:40;box-shadow:var(--shadow)}
@media (max-width:520px){
 .grid3{gap:7px}.scheme-card{padding:11px}.big-num{font-size:20px}.scheme-card h3{font-size:13px}
 .entry-values{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:700px){
 .main{padding-top:24px}.grid3{gap:14px}.quick-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="logo">RR</div>
      <div>
        <div class="brand-title">Rice Register <span style="font-size:10px;color:#64748b">v4.1-syncfix</span></div>
        <div class="brand-sub" id="periodLabel">Sep 2026 – Mar 2027</div>
      </div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
  </div>
</header>

<main class="main" id="root"></main>

<nav class="nav" id="nav">
  <button data-page="home" class="active"><span class="ic">⌂</span>Home</button>
  <button data-page="entry"><span class="ic">＋</span>Entry</button>
  <button data-page="ledger"><span class="ic">▤</span>Ledger</button>
  <button data-page="reports"><span class="ic">◫</span>Reports</button>
</nav>
</div>
<script>
(() => {
'use strict';

if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

const REGISTERS=['CMAY','NFSA'];
const SCHEMES=['AAY','PHH','SFSS'];
const MONTHS=[
 {key:'2026-09',label:'September 2026',short:'Sep 2026'},
 {key:'2026-10',label:'October 2026',short:'Oct 2026'},
 {key:'2026-11',label:'November 2026',short:'Nov 2026'},
 {key:'2026-12',label:'December 2026',short:'Dec 2026'},
 {key:'2027-01',label:'January 2027',short:'Jan 2027'},
 {key:'2027-02',label:'February 2027',short:'Feb 2027'},
 {key:'2027-03',label:'March 2027',short:'Mar 2027'}
];
const DB_NAME='rice-register-step3';
const DB_VERSION=1;
let state={page:'home',register:'CMAY',scheme:'AAY'};
const GAS_URL=()=> 'https://script.google.com/macros/s/AKfycbzZPVQbbLiKQxVsO5_AQy4spUX1ZKqQj5P2P5p6QnOWshNrEZC8LVMPr9FMhI7bTtBw/exec';

const $=s=>document.querySelector(s);
const root=$('#root');

function money(n){return Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});}
function todayISO(){const d=new Date(); const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function monthLabel(k){return MONTHS.find(x=>x.key===k)?.label||k;}
function uid(){return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

let dbp;
function db(){
  if(dbp) return dbp;
  dbp=new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('entries')){const s=d.createObjectStore('entries',{keyPath:'id'});s.createIndex('byDate','physicalDate');s.createIndex('byRegister','register');s.createIndex('byScheme','scheme');s.createIndex('byRiceMonth','riceMonth');}};
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
  return dbp;
}
async function allEntries(){
  const d=await db(); return new Promise((res,rej)=>{const q=d.transaction('entries','readonly').objectStore('entries').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});
}
async function saveEntry(e){
  const d=await db(); return new Promise((res,rej)=>{const q=d.transaction('entries','readwrite').objectStore('entries').put(e);q.onsuccess=()=>res(e);q.onerror=()=>rej(q.error);});
}
async function deleteEntry(id){
  const d=await db(); return new Promise((res,rej)=>{const q=d.transaction('entries','readwrite').objectStore('entries').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});
}

/* Calculations are grouped by register + scheme + riceMonth.
   There is NO carry between different rice months. */
function calcSeries(entries,register,scheme,riceMonth){
  const xs=entries.filter(e=>e.register===register&&e.scheme===scheme&&e.riceMonth===riceMonth)
    .sort((a,b)=>(a.physicalDate||'').localeCompare(b.physicalDate)||(a.createdAt||'').localeCompare(b.createdAt));
  let prev=0;
  return xs.map(e=>{
    const opening=(e.openingMode==='manual' && e.opening!==null && e.opening!==undefined) ? Number(e.opening)||0 : prev;
    const received=Number(e.received)||0;
    const sold=Number(e.sold)||0;
    const total=opening+received;
    const closing=total-sold;
    prev=closing;
    return {...e,calcOpening:opening,calcTotal:total,calcClosing:closing};
  });
}
function sourceEntries(entries){
  return entries.filter(e=>e.register===state.register&&e.scheme===state.scheme);
}
function latestByGroup(entries,register,scheme){
  const groups={};
  for(const e of entries.filter(x=>x.register===register&&x.scheme===scheme)){
    const k=e.riceMonth;
    if(!groups[k] || (e.physicalDate||'')>(groups[k].physicalDate||'')) groups[k]=e;
  }
  return groups;
}
function currentStock(entries,register,scheme){
  const groups=latestByGroup(entries,register,scheme);
  return Object.entries(groups).reduce((sum,[m,e])=>{
    const series=calcSeries(entries,register,scheme,m);
    return sum + (series.at(-1)?.calcClosing||0);
  },0);
}


async function apiGet(action, params={} ){
  const base=GAS_URL(); if(!base) throw new Error('Google Apps Script URL is not configured.');
  const u=new URL(base); u.searchParams.set('action',action);
  Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,v);});
  const r=await fetch(u.toString(),{cache:'no-store'}); if(!r.ok) throw new Error('Server HTTP '+r.status);
  const data=await r.json(); if(!data.ok) throw new Error(data.error||`Server error (HTTP ${r.status})`); return data;
}
async function apiHealth(){
  const data=await apiGet('health');
  return data;
}
async function apiPost(payload){
  const base=GAS_URL(); if(!base) throw new Error('Google Apps Script URL is not configured.');
  const r=await fetch(base,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('Server HTTP '+r.status);
  const text=await r.text();
  let data;
  try { data=JSON.parse(text); } catch (_) { throw new Error('Server returned non-JSON response: '+text.slice(0,180)); }
  if(!data.ok) throw new Error(data.error||'Server error');
  return data;
}
async function syncPending(){
  const url=GAS_URL(); if(!url) return {skipped:true};
  const entries=await allEntries(); const pending=entries.filter(e=>e.syncStatus==='pending');
  if(!pending.length) return {count:0};
  const rows=pending.map(e=>({...e}));
  const result=await apiPost({action:'upsertbatch',rows});
  const oks=(result.results||[]).filter(x=>x.ok);
  const failures=(result.results||[]).filter(x=>!x.ok && !x.conflict);
  for(const r of oks){ const local=entries.find(e=>e.id===r.entryId || e.entryId===r.entryId); if(local){local.syncStatus='synced';local.serverUpdatedAt=r.serverUpdatedAt||null;await saveEntry(local);} }
  if(failures.length) throw new Error(failures.map(x=>x.error||'Sync failed').join(' | '));
  return {count:oks.length, total:rows.length};
}
async function pullRemote(){
  const url=GAS_URL(); if(!url) return {skipped:true};
  const data=await apiGet('readEntries'); const remote=data.entries||[]; const local=await allEntries();
  const map=new Map(local.map(e=>[`${e.register}|${e.scheme}|${e.riceMonth}|${e.physicalDate}`,e]));
  for(const r of remote){
    const k=r.key||`${r.register}|${r.scheme}|${r.riceMonth}|${r.physicalDate}`; const l=map.get(k);
    if(l && l.syncStatus==='pending') continue;
    await saveEntry({...(l||{}),...r,id:l?.id||r.entryId,createdAt:l?.createdAt||new Date().toISOString(),updatedAt:l?.updatedAt||new Date().toISOString(),syncStatus:'synced',closingPreview:r.closing});
  }
  return {count:remote.length};
}
async function fullSync(){
  if(!navigator.onLine) throw new Error('Device is offline.');
  const result=await syncPending(); await pullRemote(); return result;
}
async function configureConnection(){
  const current=GAS_URL();
  const url=prompt('Paste the deployed Google Apps Script Web App URL for the combined CMAY + NFSA workbook:',current);
  if(url===null) return;
  localStorage.setItem(GAS_KEY,url.trim());
  try{const p=await apiGet('ping');toast(`Connected · ${p.version||'API'}`);await fullSync();render();}
  catch(err){toast('Connection failed: '+err.message);}
}
async function showProfile(){
  try{const d=await apiGet('profile'); const p=d.profile||{}; toast(`${p.fpsName||'FPS'} ${p.fpsCode||''}`.trim());}
  catch(err){toast(err.message);}
}

function renderHome(){
  root.innerHTML=`
  <section class="hero">
    <h1>${state.register} Rice Register</h1>
    <p>Native-style offline-first register · September 2026 to March 2027</p>
    <div class="toggle">
      ${REGISTERS.map(r=>`<button data-register="${r}" class="${r===state.register?'active':''}">${r}</button>`).join('')}
    </div>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Current stock</div><div class="section-link">AAY · PHH · SFSS</div></div>
    <div class="grid3" id="stockCards"></div>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Quick entry</div></div>
    <div class="quick-grid">
      <button class="quick" data-go="entry"><strong>＋ New entry</strong><span>Receive / sale / opening</span></button>
      <button class="quick" data-go="ledger"><strong>▤ Today's entries</strong><span>See multiple same-day records</span></button>
      <button class="quick" data-go="reports"><strong>◫ Reports</strong><span>Monthly and register totals</span></button>
      <button class="quick" id="syncInfo"><strong>⇄ Sync now</strong><span>${GAS_URL()?'Connected':'Connect Google Sheets'}</span></button>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Today</div><div class="section-link">${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div></div>
    <div class="card" id="todayCard"><div class="empty">Loading…</div></div>
  </section>`;
  $('#syncInfo').onclick=async()=>{
  if(!GAS_URL()) return configureConnection();
  try{
    const h=await apiHealth();
    toast(`Server OK · ${h.version||''}`);
    await fullSync();
    toast('Google Sheet sync complete');
    render();
  }catch(e){
    console.error('SYNC ERROR',e);
    toast('SYNC ERROR: '+e.message);
  }
};
  root.querySelectorAll('[data-register]').forEach(b=>b.onclick=()=>{state.register=b.dataset.register;render();});
  root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;render();});
  loadHomeData();
}
async function loadHomeData(){
  const entries=await allEntries();
  $('#stockCards').innerHTML=SCHEMES.map(s=>{
    const stock=currentStock(entries,state.register,s);
    const recv=entries.filter(e=>e.register===state.register&&e.scheme===s).reduce((a,e)=>a+(+e.received||0),0);
    const sold=entries.filter(e=>e.register===state.register&&e.scheme===s).reduce((a,e)=>a+(+e.sold||0),0);
    return `<div class="card scheme-card"><div class="scheme-top"><span class="badge">${s}</span><span style="font-size:18px">◉</span></div><h3>Available</h3><div class="big-num">${money(stock)}</div><div class="mini"><span>Recv ${money(recv)}</span><span>Sold ${money(sold)}</span></div></div>`;
  }).join('');
  const today= todayISO();
  const xs=entries.filter(e=>e.register===state.register&&e.physicalDate===today).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  $('#todayCard').innerHTML=xs.length ? xs.map(e=>`<div class="entry-card" style="box-shadow:none;border:0;border-bottom:1px solid var(--line);border-radius:0"><div class="entry-row"><div><div class="entry-title">${esc(e.scheme)} · ${esc(monthLabel(e.riceMonth))}</div><div class="entry-meta">${esc(e.physicalDate)} · ${e.register}</div></div><span class="status ${e.syncStatus}">${e.syncStatus==='synced'?'SYNCED':'LOCAL'}</span></div><div class="entry-values"><div class="ev"><span>Opening</span><strong>${money(e.opening||0)}</strong></div><div class="ev"><span>Received</span><strong>${money(e.received)}</strong></div><div class="ev"><span>Sold</span><strong>${money(e.sold)}</strong></div><div class="ev"><span>Closing</span><strong>${money(e.closingPreview)}</strong></div></div></div>`).join('') : `<div class="empty">No entries for ${today}.<br>Use <b>＋ Entry</b> to add stock.</div>`;
}

function renderEntry(){
  const defDate=todayISO();
  root.innerHTML=`
  <section class="section" style="margin-top:0">
    <div class="section-head"><div><div class="section-title">New transaction</div><div class="helper">Same physical date can have multiple rice-month entries.</div></div></div>
    <div class="card form-card">
      <div class="field"><label>Register</label><div class="segment" id="regSeg">${REGISTERS.map(r=>`<button data-val="${r}" class="${r===state.register?'active':''}">${r}</button>`).join('')}</div></div>
      <div class="field"><label>Commodity</label><div class="segment" id="schemeSeg">${SCHEMES.map(s=>`<button data-val="${s}" class="${s===state.scheme?'active':''}">${s}</button>`).join('')}</div></div>
      <div class="two-col">
        <div class="field"><label>Physical entry date</label><input id="physicalDate" type="date" value="${defDate}" min="2026-09-01" max="2027-03-31"></div>
        <div class="field"><label>Rice month / allocation</label><select id="riceMonth">${MONTHS.map(m=>`<option value="${m.key}" ${m.key===MONTHS[0].key?'selected':''}>${m.label}</option>`).join('')}</select></div>
      </div>
      <div class="field">
        <label>Opening balance</label>
        <div class="segment"><button id="autoOpen" class="active">AUTO</button><button id="manualOpen">MANUAL</button></div>
      </div>
      <div class="field" id="manualField" style="display:none"><label>Manual opening</label><input id="opening" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="three-col">
        <div class="field"><label>Received</label><input id="received" type="number" min="0" step="0.01" value="0"></div>
        <div class="field"><label>Selling</label><input id="sold" type="number" min="0" step="0.01" value="0"></div>
        <div class="field"><label>Remarks</label><input id="remarks" maxlength="120" placeholder="Optional"></div>
      </div>
      <div class="calc-grid">
        <div class="calc"><span>Opening</span><strong id="cOpen">0</strong></div>
        <div class="calc"><span>Total</span><strong id="cTotal">0</strong></div>
        <div class="calc"><span>Closing</span><strong id="cClose">0</strong></div>
        <div class="calc"><span>Entries same date</span><strong id="cCount">0</strong></div>
      </div>
      <div class="notice">Important: the selected <b>Rice month</b> is independent from the physical date. This lets you enter September, October and November allocations on the same day without overwriting one another.</div>
      <div style="height:12px"></div>
      <button class="primary" id="saveBtn">SAVE ENTRY</button>
    </div>
  </section>`;
  let mode='auto';
  const setMode=m=>{mode=m;$('#autoOpen').classList.toggle('active',m==='auto');$('#manualOpen').classList.toggle('active',m==='manual');$('#manualField').style.display=m==='manual'?'block':'none';updateCalc();};
  $('#autoOpen').onclick=()=>setMode('auto'); $('#manualOpen').onclick=()=>setMode('manual');
  $('#regSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.register=b.dataset.val;$('#regSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));});
  $('#schemeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.scheme=b.dataset.val;$('#schemeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));});
  ['physicalDate','riceMonth','opening','received','sold'].forEach(id=>$('#'+id).addEventListener('input',updateCalc));
  async function updateCalc(){
    const entries=await allEntries();
    const date=$('#physicalDate').value, rm=$('#riceMonth').value;
    let opening=0;
    if(mode==='manual') opening=Number($('#opening').value)||0;
    else {
      const series=calcSeries(entries,state.register,state.scheme,rm).filter(x=>(x.physicalDate||'')<date);
      opening=series.at(-1)?.calcClosing||0;
    }
    const received=Number($('#received').value)||0, sold=Number($('#sold').value)||0;
    $('#cOpen').textContent=money(opening); $('#cTotal').textContent=money(opening+received); $('#cClose').textContent=money(opening+received-sold);
    const count=entries.filter(e=>e.register===state.register&&e.scheme===state.scheme&&e.physicalDate===date&&e.riceMonth===rm).length;
    $('#cCount').textContent=count;
  }
  $('#saveBtn').onclick=async()=>{
    const entries=await allEntries();
    const physicalDate=$('#physicalDate').value, riceMonth=$('#riceMonth').value;
    if(!physicalDate) return toast('Select physical date');
    const received=Number($('#received').value)||0, sold=Number($('#sold').value)||0;
    let opening=null; let openingMode=mode;
    if(mode==='manual') opening=Number($('#opening').value)||0;
    const series=calcSeries(entries,state.register,state.scheme,riceMonth).filter(x=>(x.physicalDate||'')<physicalDate);
    const calcOpening=mode==='manual'?opening:(series.at(-1)?.calcClosing||0);
    const rec={id:uid(),register:state.register,scheme:state.scheme,physicalDate,riceMonth,opening,openingMode,received,sold,remarks:$('#remarks').value.trim(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),syncStatus:'pending',closingPreview:calcOpening+received-sold};
    await saveEntry(rec);
    toast('Saved on this phone');
    if (navigator.onLine && GAS_URL()) { try { await syncPending(); toast('Saved + synced'); } catch(e) { toast('Saved locally · sync pending'); } }
    $('#received').value='0';$('#sold').value='0';$('#remarks').value='';$('#opening').value='';
    await updateCalc();
  };
  updateCalc();
}

function renderLedger(){
  root.innerHTML=`
  <section class="section" style="margin-top:0">
    <div class="section-head"><div class="section-title">Ledger</div><div class="section-link">Local entries</div></div>
    <div class="card form-card">
      <div class="filters">
        <div><label>Register</label><select id="fReg">${REGISTERS.map(r=>`<option ${r===state.register?'selected':''}>${r}</option>`).join('')}</select></div>
        <div><label>Commodity</label><select id="fScheme"><option value="">All</option>${SCHEMES.map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div><label>Rice month</label><select id="fMonth"><option value="">All</option>${MONTHS.map(m=>`<option value="${m.key}">${m.label}</option>`).join('')}</select></div>
        <div><label>Date</label><input id="fDate" type="date"></div>
      </div>
    </div>
    <div class="section" id="ledgerList"></div>
  </section>`;
  ['fReg','fScheme','fMonth','fDate'].forEach(id=>$('#'+id).onchange=loadLedger);
  loadLedger();
}
async function loadLedger(){
  const entries=await allEntries();
  const fr=$('#fReg').value, fs=$('#fScheme').value, fm=$('#fMonth').value, fd=$('#fDate').value;
  const xs=entries.filter(e=>(!fr||e.register===fr)&&(!fs||e.scheme===fs)&&(!fm||e.riceMonth===fm)&&(!fd||e.physicalDate===fd))
    .sort((a,b)=>(b.physicalDate||'').localeCompare(a.physicalDate||'')||(b.createdAt||'').localeCompare(a.createdAt||''));
  $('#ledgerList').innerHTML=xs.length?xs.map(e=>`
    <div class="card entry-card">
      <div class="entry-row"><div><div class="entry-title">${esc(e.register)} · ${esc(e.scheme)} · ${esc(monthLabel(e.riceMonth))}</div><div class="entry-meta">${esc(e.physicalDate)}${e.remarks?' · '+esc(e.remarks):''}</div></div><span class="status ${e.syncStatus}">${e.syncStatus==='synced'?'SYNCED':'LOCAL'}</span></div>
      <div class="entry-values"><div class="ev"><span>Opening</span><strong>${money(e.opening ?? e.closingPreview)}</strong></div><div class="ev"><span>Received</span><strong>${money(e.received)}</strong></div><div class="ev"><span>Selling</span><strong>${money(e.sold)}</strong></div><div class="ev"><span>Closing</span><strong>${money(e.closingPreview)}</strong></div></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="secondary del" data-id="${e.id}">Delete</button></div>
    </div>`).join(''):`<div class="card empty">No matching entries.</div>`;
  root.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(confirm('Delete this local entry?')){await deleteEntry(b.dataset.id);toast('Deleted');loadLedger();}});
}

function renderReports(){
  root.innerHTML=`
  <section class="section" style="margin-top:0">
    <div class="section-head"><div><div class="section-title">Reports</div><div class="helper">Preview logic before Google Sheets connection.</div></div></div>
    <div class="toggle card" style="padding:4px">${REGISTERS.map(r=>`<button data-r="${r}" class="${r===state.register?'active':''}">${r}</button>`).join('')}</div>
    <div id="reportBody" class="section"></div>
  </section>`;
  root.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{state.register=b.dataset.r;renderReports();});
  loadReports();
}
async function loadReports(){
  const entries=await allEntries();
  const parts=MONTHS.map(m=>{
    const vals=SCHEMES.map(s=>{
      const series=calcSeries(entries,state.register,s,m.key);
      const recv=series.reduce((a,e)=>a+e.received,0);
      const sold=series.reduce((a,e)=>a+e.sold,0);
      const close=series.at(-1)?.calcClosing||0;
      return `<div class="card scheme-card"><span class="badge">${s}</span><div class="mini" style="margin-top:12px"><span>Received</span><b>${money(recv)}</b></div><div class="mini"><span>Selling</span><b>${money(sold)}</b></div><div class="mini"><span>Closing</span><b>${money(close)}</b></div></div>`;
    }).join('');
    return `<section class="section"><div class="section-head"><div class="section-title">${m.label}</div></div><div class="grid3">${vals}</div></section>`;
  }).join('');
  $('#reportBody').innerHTML=parts;
}

function getProfile(){
  try{return JSON.parse(localStorage.getItem('rice-register-profile')||'{}');}catch{return {};}
}
function saveProfile(){
  const profile={fpsName:$('#setFpsName').value.trim(),dealerName:$('#setDealerName').value.trim(),fpsCode:$('#setFpsCode').value.trim(),place:$('#setPlace').value.trim()};
  localStorage.setItem('rice-register-profile',JSON.stringify(profile));
  toast('Dealer details saved');
  closeSettings();
  render();
}
function applyTheme(theme, persist=true){
  const t=['light','dark','bw'].includes(theme)?theme:'light';
  document.documentElement.dataset.theme=t;
  if(persist)localStorage.setItem('rice-register-theme',t);
}
function openSettings(){
  const p=getProfile(), t=localStorage.getItem('rice-register-theme')||'light';
  const wrap=document.createElement('div');wrap.className='settings-sheet';wrap.id='settingsSheet';
  wrap.innerHTML=`<div class="settings-panel" role="dialog" aria-modal="true">
    <div class="settings-head"><h2>Settings</h2><button class="close-btn" id="closeSettings">×</button></div>
    <div class="setting-section"><div class="setting-title">Appearance</div><div class="theme-grid">
      <button class="theme-btn ${t==='light'?'active':''}" data-theme-choice="light"><div class="theme-preview theme-light"></div>Light</button>
      <button class="theme-btn ${t==='dark'?'active':''}" data-theme-choice="dark"><div class="theme-preview theme-dark"></div>Dark</button>
      <button class="theme-btn ${t==='bw'?'active':''}" data-theme-choice="bw"><div class="theme-preview theme-bw"></div>Black & White</button>
    </div></div>
    <div class="setting-section"><div class="setting-title">Dealer / FPS Details</div><div class="settings-grid">
      <div><label>FPS Name</label><input id="setFpsName" value="${esc(p.fpsName||'')}" placeholder="Fair Price Shop"></div>
      <div><label>Dealer Name</label><input id="setDealerName" value="${esc(p.dealerName||'')}" placeholder="Dealer name"></div>
      <div><label>FPS Code</label><input id="setFpsCode" value="${esc(p.fpsCode||'')}" placeholder="FPS code"></div>
      <div><label>Place / Village</label><input id="setPlace" value="${esc(p.place||'')}" placeholder="Place"></div>
    </div></div>
    <div class="setting-section"><div class="setting-title">Connection</div><div class="notice">Google Sheets integration is built into this app and is not exposed here. Use Sync from Home when you need a manual sync.</div></div>
    <div class="setting-section"><div class="settings-actions"><button class="secondary" id="resetTheme">Reset appearance</button><button class="primary" id="saveProfile">SAVE SETTINGS</button></div></div>
  </div>`;
  document.body.appendChild(wrap);
  $('#closeSettings').onclick=closeSettings;
  wrap.addEventListener('click',e=>{if(e.target===wrap)closeSettings();});
  wrap.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.themeChoice);wrap.querySelectorAll('[data-theme-choice]').forEach(x=>x.classList.toggle('active',x===b));});
  $('#resetTheme').onclick=()=>{applyTheme('light');wrap.querySelectorAll('[data-theme-choice]').forEach(x=>x.classList.toggle('active',x.dataset.themeChoice==='light'));};
  $('#saveProfile').onclick=saveProfile;
}
function closeSettings(){document.getElementById('settingsSheet')?.remove();}

function render(){
  $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
  if(state.page==='home')renderHome();
  else if(state.page==='entry')renderEntry();
  else if(state.page==='ledger')renderLedger();
  else if(state.page==='reports')renderReports();
}
$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render();});
applyTheme(localStorage.getItem('rice-register-theme')||'light',false);
$('#settingsBtn').onclick=openSettings;
render();
window.addEventListener('online',()=>{if(GAS_URL()) fullSync().then(()=>toast('Back online · synced')).catch(()=>{});});
if(GAS_URL() && navigator.onLine) setTimeout(()=>fullSync().then(()=>render()).catch(()=>{}),700);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
