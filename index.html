<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<title>Rice Register</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#111;--muted:#6b7280;--line:#d9dce1;--accent:#111;--accentText:#fff;--soft:#f7f7f8;--ok:#166534;--danger:#991b1b;--shadow:0 8px 26px rgba(0,0,0,.06)}
html[data-theme=dark]{--bg:#0d0e10;--card:#15171a;--text:#f4f4f5;--muted:#a1a1aa;--line:#2a2d31;--accent:#f4f4f5;--accentText:#111;--soft:#1d2024;--ok:#86efac;--danger:#fca5a5;--shadow:0 10px 30px rgba(0,0,0,.25)}
html[data-theme=bw]{--bg:#fff;--card:#fff;--text:#111;--muted:#4b5563;--line:#111;--accent:#111;--accentText:#fff;--soft:#eee;--ok:#111;--danger:#111;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:94px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);padding:12px 14px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-weight:900}.brand b{display:block;font-size:15px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.gear{width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px}
main{padding:14px}.hero{border-radius:22px;background:var(--accent);color:var(--accentText);padding:18px;box-shadow:var(--shadow)}.hero .small{opacity:.7;font-size:11px}.hero h1{margin:3px 0 4px;font-size:25px;letter-spacing:-.04em}.hero p{margin:0;opacity:.75;font-size:12px}
.switch{display:flex;gap:5px;background:color-mix(in srgb,var(--accentText) 15%,transparent);padding:4px;border-radius:12px;margin-top:14px}.switch button{flex:1;border:0;border-radius:9px;padding:9px;background:transparent;color:inherit;font-weight:900}.switch button.active{background:var(--accentText);color:var(--accent);}
.rowhead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.rowhead b{font-size:14px}.rowhead span{font-size:11px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:var(--shadow)}.metric .tag{font-size:10px;font-weight:900;letter-spacing:.04em}.metric .v{font-size:22px;font-weight:900;line-height:1.1;margin-top:6px}.metric .mini{font-size:10px;color:var(--muted);margin-top:5px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--text);box-shadow:var(--shadow)}.quick strong{display:block;font-size:13px}.quick small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.entry-card{padding:14px}.seg{display:flex;gap:6px;overflow:auto}.seg button{min-width:80px;flex:1;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:11px;padding:9px 8px;font-weight:900;font-size:12px}.seg button.active{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.compact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{font-size:10px;font-weight:900;color:var(--muted);display:block;margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em}.field{margin-bottom:10px}
input,select{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:11px;padding:11px 10px;outline:0;font-size:13px}.numgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.numbox{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:9px}.nlabel{font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase}.numbox input{margin-top:3px;padding:4px 0 0;border:0;background:transparent;border-radius:0;font-size:21px;font-weight:900}.calcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 10px}.calc{background:var(--soft);border:1px dashed var(--line);border-radius:13px;padding:9px}.calc span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.calc b{display:block;font-size:17px;margin-top:3px}.save{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accentText);padding:13px;font-weight:1000;font-size:14px}.helper{font-size:10px;color:var(--muted);line-height:1.45;margin:8px 2px}
.entry{padding:12px}.entrytop{display:flex;justify-content:space-between;gap:8px}.etitle{font-weight:900;font-size:12px}.emeta{color:var(--muted);font-size:10px;margin-top:3px}.status{font-size:9px;font-weight:900;border-radius:999px;padding:5px 7px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}.values{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.value{background:var(--soft);border-radius:10px;padding:7px}.value span{font-size:8px;color:var(--muted);display:block}.value b{font-size:12px;display:block;margin-top:2px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.empty{text-align:center;padding:28px;color:var(--muted);font-size:12px}.report{padding:12px}.reportline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}.reportline:last-child{border-bottom:0}
.nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(730px,calc(100% - 18px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.12)}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 3px;border-radius:12px;font-size:10px;font-weight:900}.nav button.active{background:var(--accent);color:var(--accentText)}.nav i{display:block;font-style:normal;font-size:17px;line-height:1.1;margin-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:var(--card);color:var(--text);border-radius:24px 24px 0 0;padding:16px 16px 28px;max-height:88vh;overflow:auto}.handle{width:42px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 14px}.sheet h2{margin:0 0 12px;font-size:18px}.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.themegrid button{padding:11px 5px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);font-weight:900;font-size:11px}.themegrid button.active{background:var(--accent);color:var(--accentText)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 12px;border-radius:10px;font-size:11px;z-index:70}
@media(min-width:700px){main{padding:20px}.quick{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div class="brand"><div class="logo">RR</div><div><b id="brandName">Rice Register</b><span id="brandSub">Sep 2026 – Mar 2027</span></div></div><button class="gear" id="settingsBtn">⚙</button></div></header>
<main id="root"></main>
<nav class="nav" id="nav"><button class="active" data-page="home"><i>⌂</i>Home</button><button data-page="entry"><i>＋</i>Entry</button><button data-page="ledger"><i>▤</i>Ledger</button><button data-page="reports"><i>◫</i>Reports</button></nav>
</div>
<div class="modal" id="settingsModal"><div class="sheet"><div class="handle"></div><div class="toprow"><h2>Settings</h2><button class="gear" id="closeSettings">×</button></div><div class="rowhead"><b>Appearance</b><span>Saved on this device</span></div><div class="themegrid" id="themeGrid"><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button><button data-theme-choice="bw">Black & White</button></div><div class="rowhead"><b>FPS / Dealer details</b></div><div class="two"><div class="field"><label>FPS Name</label><input id="sFps"></div><div class="field"><label>Dealer Name</label><input id="sDealer"></div><div class="field"><label>FPS Code</label><input id="sCode"></div><div class="field"><label>Place / Village</label><input id="sPlace"></div></div><button class="save" id="saveSettings">SAVE SETTINGS</button><div class="helper">Google Apps Script integration is built into the app and intentionally hidden from normal user settings.</div></div></div>
<script>
(() => {
'use strict';
const REGISTERS=['CMAY','NFSA'], SCHEMES=['AAY','PHH','SFSS'];
const MONTHS=[['2026-09','September 2026'],['2026-10','October 2026'],['2026-11','November 2026'],['2026-12','December 2026'],['2027-01','January 2027'],['2027-02','February 2027'],['2027-03','March 2027']];
const GAS_URL='https://script.google.com/macros/s/AKfycbzZPVQbbLiKQxVsO5_AQy4spUX1ZKqQj5P2P5p6QnOWshNrEZC8LVMPr9FMhI7bTtBw/exec';
const DB='rice-register-step3', VER=1; let state={page:'home',register:localStorage.getItem('rr-reg')||'CMAY',scheme:localStorage.getItem('rr-scheme')||'AAY'};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); const monthLabel=k=>MONTHS.find(m=>m[0]===k)?.[1]||k; const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2); const today=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),1900)}
let dbp; function db(){if(dbp)return dbp;dbp=new Promise((resolve,reject)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('entries')){const s=d.createObjectStore('entries',{keyPath:'id'});s.createIndex('byDate','physicalDate');s.createIndex('byRegister','register');s.createIndex('byScheme','scheme');s.createIndex('byRiceMonth','riceMonth')}};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbp}
async function all(){const d=await db();return new Promise((res,rej)=>{const q=d.transaction('entries','readonly').objectStore('entries').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function put(e){const d=await db();return new Promise((res,rej)=>{const q=d.transaction('entries','readwrite').objectStore('entries').put(e);q.onsuccess=()=>res(e);q.onerror=()=>rej(q.error)})}
async function del(id){const d=await db();return new Promise((res,rej)=>{const q=d.transaction('entries','readwrite').objectStore('entries').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function calc(entries,reg,sch,rm){const xs=entries.filter(e=>e.register===reg&&e.scheme===sch&&e.riceMonth===rm).sort((a,b)=>(a.physicalDate||'').localeCompare(b.physicalDate)||(a.createdAt||'').localeCompare(b.createdAt));let prev=0;return xs.map(e=>{const op=e.openingMode==='manual'?Number(e.opening)||0:prev,rec=Number(e.received)||0,sold=Number(e.sold)||0,total=op+rec,close=total-sold;prev=close;return {...e,calcOpening:op,calcTotal:total,calcClosing:close}})}
function stock(entries,reg,sch){return MONTHS.reduce((sum,m)=>{const s=calc(entries,reg,sch,m[0]);return sum+(s.at(-1)?.calcClosing||0)},0)}
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('rr-theme',t);document.querySelectorAll('[data-theme-choice]').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===t))}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page)); if(state.page==='home')home();else if(state.page==='entry')entry();else if(state.page==='ledger')ledger();else reports()}
async function home(){const es=await all();root.innerHTML=`<section class="hero"><div class="small">FPS RICE MANAGEMENT</div><h1>${state.register} Register</h1><p>September 2026 → March 2027</p><div class="switch">${REGISTERS.map(r=>`<button class="${r===state.register?'active':''}" data-r="${r}">${r}</button>`).join('')}</div></section><div class="rowhead"><b>Stock overview</b><span>AAY · PHH · SFSS</span></div><div class="grid3" id="metrics"></div><div class="rowhead"><b>Quick actions</b></div><div class="quick"><button data-go="entry"><strong>＋ New Entry</strong><small>Compact daily stock entry</small></button><button data-go="ledger"><strong>▤ Today / Ledger</strong><small>See every same-date entry</small></button><button data-go="reports"><strong>◫ Reports</strong><small>Monthly totals by scheme</small></button><button id="syncHome"><strong>⇄ Sync</strong><small>Save online when available</small></button></div><div class="rowhead"><b>Today</b><span>${today()}</span></div><div class="card" id="todayList"></div>`;
$('#metrics').innerHTML=SCHEMES.map(s=>{const rec=es.filter(e=>e.register===state.register&&e.scheme===s).reduce((a,e)=>a+(+e.received||0),0),sold=es.filter(e=>e.register===state.register&&e.scheme===s).reduce((a,e)=>a+(+e.sold||0),0);return `<div class="metric"><div class="tag">${s}</div><div class="v">${money(stock(es,state.register,s))}</div><div class="mini">Available · R ${money(rec)} · S ${money(sold)}</div></div>`}).join('');
const tx=es.filter(e=>e.register===state.register&&e.physicalDate===today()).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));$('#todayList').innerHTML=tx.length?tx.map(e=>`<div class="entry"><div class="entrytop"><div><div class="etitle">${e.scheme} · ${monthLabel(e.riceMonth)}</div><div class="emeta">${e.physicalDate} · ${e.register}</div></div><span class="status">${e.syncStatus==='synced'?'SYNCED':'LOCAL'}</span></div><div class="values"><div class="value"><span>Open</span><b>${money(e.opening??e.closingPreview)}</b></div><div class="value"><span>Recv</span><b>${money(e.received)}</b></div><div class="value"><span>Sell</span><b>${money(e.sold)}</b></div><div class="value"><span>Close</span><b>${money(e.closingPreview)}</b></div></div></div>`).join(''):`<div class="empty">No entries today.</div>`;
root.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{state.register=b.dataset.r;localStorage.setItem('rr-reg',state.register);render()});root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;render()});$('#syncHome').onclick=()=>syncAll()}
async function entry(){root.innerHTML=`<div class="rowhead" style="margin-top:0"><b>Quick Entry</b><span>Same date + different rice month allowed</span></div><div class="card entry-card"><div class="field"><label>Register</label><div class="seg" id="rseg">${REGISTERS.map(r=>`<button data-r="${r}" class="${r===state.register?'active':''}">${r}</button>`).join('')}</div></div><div class="field"><label>Commodity</label><div class="seg" id="sseg">${SCHEMES.map(s=>`<button data-s="${s}" class="${s===state.scheme?'active':''}">${s}</button>`).join('')}</div></div><div class="compact-grid"><div class="field"><label>Physical Date</label><input id="date" type="date" value="${today()}" min="2026-09-01" max="2027-03-31"></div><div class="field"><label>Rice Month</label><select id="rm">${MONTHS.map((m,i)=>`<option value="${m[0]}" ${i===0?'selected':''}>${m[1]}</option>`).join('')}</select></div></div><div class="field"><label>Opening</label><div class="seg"><button id="auto" class="active">AUTO</button><button id="manual">MANUAL</button></div></div><div class="field" id="manualBox" style="display:none"><div class="numbox"><div class="nlabel">Manual opening</div><input id="opening" type="number" min="0" step="0.01" placeholder="0"></div></div><div class="numgrid"><div class="numbox"><div class="nlabel">Received</div><input id="received" type="number" min="0" step="0.01" value="0"></div><div class="numbox"><div class="nlabel">Selling</div><input id="sold" type="number" min="0" step="0.01" value="0"></div><div class="numbox"><div class="nlabel">Remarks</div><input id="remarks" type="text" maxlength="100" placeholder="Optional"></div></div><div class="calcgrid"><div class="calc"><span>Opening</span><b id="co">0</b></div><div class="calc"><span>Total</span><b id="ct">0</b></div><div class="calc"><span>Closing</span><b id="cc">0</b></div></div><div class="helper">The physical date and Rice Month are independent. You can save 2–3 different allocation months on the same date without overwriting each other.</div><button class="save" id="save">SAVE ENTRY</button></div>`;
let mode='auto'; const updateMode=m=>{mode=m;$('#auto').classList.toggle('active',m==='auto');$('#manual').classList.toggle('active',m==='manual');$('#manualBox').style.display=m==='manual'?'block':'none';calcPreview()};
$('#auto').onclick=()=>updateMode('auto');$('#manual').onclick=()=>updateMode('manual');root.querySelectorAll('#rseg button').forEach(b=>b.onclick=()=>{state.register=b.dataset.r;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));localStorage.setItem('rr-reg',state.register)});root.querySelectorAll('#sseg button').forEach(b=>b.onclick=()=>{state.scheme=b.dataset.s;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));localStorage.setItem('rr-scheme',state.scheme)});['date','rm','opening','received','sold'].forEach(id=>$('#'+id).addEventListener('input',calcPreview));
async function calcPreview(){const es=await all(),d=$('#date').value,rm=$('#rm').value;const prev=calc(es,state.register,state.scheme,rm).filter(x=>x.physicalDate<d).at(-1)?.calcClosing||0;const op=mode==='manual'?(+$('#opening').value||0):prev;const rec=+$('#received').value||0,s=+$('#sold').value||0;$('#co').textContent=money(op);$('#ct').textContent=money(op+rec);$('#cc').textContent=money(op+rec-s)}
$('#save').onclick=async()=>{const d=$('#date').value,rm=$('#rm').value;if(!d)return toast('Select date');const es=await all(),prev=calc(es,state.register,state.scheme,rm).filter(x=>x.physicalDate<d).at(-1)?.calcClosing||0,op=mode==='manual'?(+$('#opening').value||0):prev,rec=+$('#received').value||0,s=+$('#sold').value||0;const recd={id:uid(),register:state.register,scheme:state.scheme,physicalDate:d,riceMonth:rm,opening:mode==='manual'?op:null,openingMode:mode,received:rec,sold:s,remarks:$('#remarks').value.trim(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),syncStatus:'pending',closingPreview:op+rec-s};await put(recd);toast('Saved on phone');$('#received').value='0';$('#sold').value='0';$('#remarks').value='';$('#opening').value='';calcPreview();setTimeout(()=>syncEntry(recd),50)};
calcPreview()}
async function ledger(){root.innerHTML=`<div class="rowhead" style="margin-top:0"><b>Ledger</b><span>Every transaction remains separate</span></div><div class="card filters"><div><label>Register</label><select id="fr">${REGISTERS.map(r=>`<option ${r===state.register?'selected':''}>${r}</option>`).join('')}</select></div><div><label>Commodity</label><select id="fs"><option value="">All</option>${SCHEMES.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Rice Month</label><select id="fm"><option value="">All</option>${MONTHS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('')}</select></div><div><label>Date</label><input id="fd" type="date"></div></div><div id="list" style="margin-top:9px"></div>`;['fr','fs','fm','fd'].forEach(id=>$('#'+id).onchange=draw);draw();async function draw(){const es=await all(),fr=$('#fr').value,fs=$('#fs').value,fm=$('#fm').value,fd=$('#fd').value,xs=es.filter(e=>(!fr||e.register===fr)&&(!fs||e.scheme===fs)&&(!fm||e.riceMonth===fm)&&(!fd||e.physicalDate===fd)).sort((a,b)=>(b.physicalDate||'').localeCompare(a.physicalDate||'')||(b.createdAt||'').localeCompare(a.createdAt||''));$('#list').innerHTML=xs.length?xs.map(e=>`<div class="card entry" style="margin-bottom:8px"><div class="entrytop"><div><div class="etitle">${e.register} · ${e.scheme} · ${monthLabel(e.riceMonth)}</div><div class="emeta">${e.physicalDate}${e.remarks?' · '+esc(e.remarks):''}</div></div><span class="status">${e.syncStatus==='synced'?'SYNCED':'LOCAL'}</span></div><div class="values"><div class="value"><span>Open</span><b>${money(e.opening??e.closingPreview)}</b></div><div class="value"><span>Recv</span><b>${money(e.received)}</b></div><div class="value"><span>Sell</span><b>${money(e.sold)}</b></div><div class="value"><span>Close</span><b>${money(e.closingPreview)}</b></div></div><div style="text-align:right;margin-top:8px"><button class="gear" data-del="${e.id}" style="width:auto;padding:0 11px">Delete</button></div></div>`).join(''):`<div class="card empty">No matching entries.</div>`;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this local entry?')){await del(b.dataset.del);toast('Deleted');draw()}})}}
async function reports(){const es=await all();root.innerHTML=`<div class="rowhead" style="margin-top:0"><b>Reports</b><span>${state.register}</span></div><div class="switch" style="background:var(--soft);color:var(--text)">${REGISTERS.map(r=>`<button data-r="${r}" style="color:var(--text)" class="${r===state.register?'active':''}">${r}</button>`).join('')}</div><div id="rep"></div>`;root.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{state.register=b.dataset.r;localStorage.setItem('rr-reg',state.register);reports()});$('#rep').innerHTML=MONTHS.map(m=>{const row=SCHEMES.map(s=>{const sr=calc(es,state.register,s,m[0]);const recv=sr.reduce((a,e)=>a+e.received,0),sold=sr.reduce((a,e)=>a+e.sold,0),close=sr.at(-1)?.calcClosing||0;return `<div class="card report" style="margin-top:8px"><div class="tag" style="font-size:10px;font-weight:900">${s}</div><div class="reportline"><span>Received</span><b>${money(recv)}</b></div><div class="reportline"><span>Selling</span><b>${money(sold)}</b></div><div class="reportline"><span>Closing</span><b>${money(close)}</b></div></div>`}).join('');return `<div class="rowhead"><b>${m[1]}</b><span>${state.register}</span></div>${row}`}).join('')}
async function syncEntry(e){try{const payload={action:'upsert',entry:e};const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const j=await r.json();if(j&&j.ok){e.syncStatus='synced';e.updatedAt=new Date().toISOString();await put(e);toast('Synced to Google Sheet')}}catch(err){}}
async function syncAll(){const es=await all(),pending=es.filter(e=>e.syncStatus!=='synced');if(!pending.length)return toast('Nothing to sync');let ok=0;for(const e of pending){try{const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'upsert',entry:e})});const j=await r.json();if(j&&j.ok){e.syncStatus='synced';await put(e);ok++}}catch(err){}}toast(ok?`${ok} synced`:'Still offline')}
$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});
$('#settingsBtn').onclick=()=>{const t=localStorage.getItem('rr-theme')||'light';applyTheme(t);$('#sFps').value=localStorage.getItem('rr-fps')||'';$('#sDealer').value=localStorage.getItem('rr-dealer')||'';$('#sCode').value=localStorage.getItem('rr-code')||'';$('#sPlace').value=localStorage.getItem('rr-place')||'';$('#settingsModal').classList.add('show')};$('#closeSettings').onclick=()=>$('#settingsModal').classList.remove('show');$('#settingsModal').onclick=e=>{if(e.target.id==='settingsModal')$('#settingsModal').classList.remove('show')};document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.themeChoice));$('#saveSettings').onclick=()=>{localStorage.setItem('rr-fps',$('#sFps').value.trim());localStorage.setItem('rr-dealer',$('#sDealer').value.trim());localStorage.setItem('rr-code',$('#sCode').value.trim());localStorage.setItem('rr-place',$('#sPlace').value.trim());$('#settingsModal').classList.remove('show');toast('Settings saved');updateBrand()};
function updateBrand(){const fps=localStorage.getItem('rr-fps');$('#brandName').textContent=fps||'Rice Register';$('#brandSub').textContent=(localStorage.getItem('rr-place')||'')?`${localStorage.getItem('rr-place')} · Sep 2026 – Mar 2027`:'Sep 2026 – Mar 2027'}
applyTheme(localStorage.getItem('rr-theme')||'light');updateBrand();window.addEventListener('online',syncAll);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
})();
</script>
</body>
</html>
